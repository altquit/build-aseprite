name: Aseprite

on:
  push:
    branches: [main]
    paths: ['BuildLog.md']
  workflow_dispatch:

env:
  BUILD_TYPE: Release
  SKIA_VERSION: m124-08a5439a6b # Centralized version for easier updates

jobs:
  fetch-aseprite-info:
    name: Fetch deps info
    runs-on: ubuntu-latest
    outputs:
      download-link: ${{ steps.aseprite-link.outputs.download-link }}
      release-tag: ${{ steps.aseprite-link.outputs.release-tag }}
    steps:
      - id: aseprite-link
        uses: a1393323447/fetch-release@main
        with:
            group: aseprite
            repo: aseprite
            match: Aseprite-.*?-Source.zip

  create-release:
    name: Create Release
    runs-on: ubuntu-latest
    needs: fetch-aseprite-info
    permissions:
      contents: write
    outputs:
      release-tag: ${{ needs.fetch-aseprite-info.outputs.release-tag }}
    steps:
      - uses: actions/checkout@v4
      - uses: ncipollo/release-action@v1
        with:
          tag: ${{ needs.fetch-aseprite-info.outputs.release-tag }}
          body: Aseprite-${{ needs.fetch-aseprite-info.outputs.release-tag }}
          skipIfReleaseExists: true
          token: ${{ secrets.GITHUB_TOKEN }}

  build-aseprite:
    name: Build Aseprite (${{ matrix.os }})
    needs: create-release
    permissions:
      contents: write
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            skia_url: Skia-Windows-Release-x64.zip
            skia_arch: x64
            platform: Windows
          - os: ubuntu-latest
            skia_url: Skia-Linux-Release-x64.zip
            skia_arch: x64
            platform: Linux
          - os: macos-latest
            skia_url: Skia-macOS-Release-arm64.zip
            skia_arch: arm64
            platform: macOS

    steps:
      - name: Install Linux Dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y libpixman-1-dev libfreetype6-dev libharfbuzz-dev zlib1g-dev \
            libx11-dev libxcursor-dev libxi-dev libxrandr-dev libgl1-mesa-dev libfontconfig1-dev

      - name: Checkout Aseprite
        uses: actions/checkout@v4
        with:
          repository: aseprite/aseprite
          ref: ${{ needs.create-release.outputs.release-tag }}
          submodules: recursive

      - name: Setup Skia
        shell: bash
        run: |
          mkdir skia
          curl -L "https://github.com/aseprite/skia/releases/download/${{ env.SKIA_VERSION }}/${{ matrix.skia_url }}" -o skia.zip
          unzip skia.zip -d skia
          rm skia.zip

      - uses: aseprite/get-ninja@main
      - uses: ilammy/msvc-dev-cmd@v1
        if: runner.os == 'Windows'

      - name: Configure CMake
        shell: bash
        run: |
          cmake -S . -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=${{ env.BUILD_TYPE }} \
            -DCMAKE_OSX_DEPLOYMENT_TARGET=10.9 \
            -DENABLE_TESTS=OFF \
            -DENABLE_SCRIPTING=ON \
            -DENABLE_CCACHE=OFF \
            -DLAF_BACKEND=skia \
            -DSKIA_DIR=$(realpath skia) \
            -DOPENSSL_USE_STATIC_LIBS=ON \
            -DSKIA_LIBRARY_DIR=$(realpath skia/out/Release-${{ matrix.skia_arch }})

      - name: Compile
        run: cmake --build build --config ${{ env.BUILD_TYPE }}

      - name: Prepare Portable Binary
        shell: bash
        working-directory: build/bin
        run: |
          # Remove everything except the executable and data folder
          find . -mindepth 1 ! \( -name 'aseprite' -o -name 'aseprite.exe' -o -name 'data' -prune -o -name 'Aseprite.app' -prune \) -exec rm -rf {} +
          echo '# Portable mode' > aseprite.ini
          7z a "Aseprite-${{ needs.create-release.outputs.release-tag }}-${{ matrix.platform }}.zip" *

      - name: Upload Release Asset
        uses: svenstaro/upload-release-action@v2
        with:
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          file: build/bin/Aseprite-${{ needs.create-release.outputs.release-tag }}-${{ matrix.platform }}.zip
          asset_name: Aseprite-${{ needs.create-release.outputs.release-tag }}-${{ matrix.platform }}.zip
          tag: ${{ needs.create-release.outputs.release-tag }}